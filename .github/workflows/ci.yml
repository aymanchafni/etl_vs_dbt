name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest==8.3.4 ruff==0.8.4
      - name: Lint
        run: ruff check .
      - name: Tests (tiny TPC-H, both pipelines, output equivalence)
        run: pytest -v
      - name: Full study at SF 0.01 (smoke test)
        run: python main.py all --sf 0.01
